mod_description=Sorts the inventory and chests by configurable rules and an item tree, refills used-up tools and stacks automatically and adds shortcuts to move items around. Client only: everything happens through normal inventory clicks, so it works on any server. NeoForge port of Inventory Tweaks 1.54b from Hexxit 1.0.11.
