pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    // Lets Gradle download the JDK 25 toolchain Minecraft 26.x needs when none is installed.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'hexxit'

// One Gradle subproject per ported mod: every directory in mods/ that has a gradle.properties.
file('mods').listFiles().findAll { new File(it, 'gradle.properties').isFile() }.sort().each { dir ->
    include ":${dir.name}"
    project(":${dir.name}").projectDir = dir
}
