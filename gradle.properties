org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true

# Target platform. NeoForge versions are <minecraft>.<build>.
minecraft_version=26.3
neo_version=26.3.0.102

# JEI for the target version: https://maven.blamejared.com/mezz/jei/jei-26.3-neoforge/
jei_version=31.17.0.113

# Lombok (compile only) for the original sources of Mantle and Tinkers' Construct 3 (Teil 27)
lombok_version=1.18.42

# TerraBlender (biome regions, used by ExtrabiomesXL in Hexxit Integrated): https://maven.minecraftforge.net/com/github/glitchfiend/TerraBlender-neoforge/
terrablender_version=26.3-26.3.0.0.9

# Sodium + Iris (client only, Modrinth: https://modrinth.com/mod/sodium , https://modrinth.com/mod/iris).
# Iris is off: Iris 1.11.7 (newest for 26.3) crashes with every shader pack on NeoForge 26.3.0.102, also without any
# Hexxit mod (FrontendRenderPass.validateDraw), and Sodium 0.9.3 refuses Iris below 1.12.1. As soon as Iris >= 1.12.1
# for 26.3 is on Modrinth, set iris_version to it (e.g. iris_version=1.12.1+26.3-neoforge) and test with a shader pack.
sodium_version=mc26.3-0.9.3-neoforge
iris_version=
