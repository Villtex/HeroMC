plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

// Every subproject (mods/<name>) is one mod of the original Hexxit 1.0.11 pack, ported to NeoForge.
// The root project is the assembled pack: its client/server runs load all of them together.
evaluationDependsOnChildren()

allprojects {
    apply plugin: 'java-library'
    apply plugin: 'net.neoforged.moddev'

    group = 'hexxit'

    java.toolchain.languageVersion = JavaLanguageVersion.of(25)
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
        // show all errors of a port at once (javac stops at 100 by default)
        options.compilerArgs += ['-Xmaxerrs', '100000']
    }

    neoForge {
        version = neo_version
    }

    repositories {
        // JEI (Just Enough Items) replaces NEI of the original pack
        maven {
            url = 'https://maven.blamejared.com'
            content {
                includeGroup 'mezz.jei'
                includeGroup 'net.mezzdev.config'
            }
        }
        // Sodium and Iris (client renderer and shader loader the pack is kept compatible with)
        maven {
            url = 'https://api.modrinth.com/maven'
            content {
                includeGroup 'maven.modrinth'
            }
        }
        // TerraBlender: region API for overworld biomes (ExtrabiomesXL in Hexxit Integrated)
        maven {
            url = 'https://maven.minecraftforge.net'
            content {
                includeGroup 'com.github.glitchfiend'
            }
        }
    }
}

subprojects {
    version = mod_version
    base.archivesName = "${mod_id}-neoforge-${minecraft_version}"

    neoForge.mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // Other mods of the pack this one builds on: "mod_requires=<directory>,<directory>" in gradle.properties.
    def required = (findProperty('mod_requires') ?: '').tokenize(',')*.trim()
    required.each { evaluationDependsOn(":${it}") }
    dependencies {
        required.each { implementation project(":${it}") }
        // every mod may bring a JEI plugin; JEI itself is only on the runtime classpath of the pack runs
        compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    }
    // "mod_uses_lombok=true": original sources written with Lombok and JSR-305 annotations (Teil 27: Mantle, Tinkers 3)
    if ((findProperty('mod_uses_lombok') ?: 'false').toBoolean()) {
        dependencies {
            compileOnly "org.projectlombok:lombok:${lombok_version}"
            annotationProcessor "org.projectlombok:lombok:${lombok_version}"
            compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
        }
    }
    // "mod_uses_terrablender=true": the mod registers biome regions with TerraBlender (a library mod of the pack)
    def usesTerraBlender = (findProperty('mod_uses_terrablender') ?: 'false').toBoolean()
    if (usesTerraBlender) {
        dependencies {
            implementation "com.github.glitchfiend:TerraBlender-neoforge:${terrablender_version}"
        }
    }
    def requiredToml = required.collect { name ->
        """
[[dependencies.${mod_id}]]
modId="${project(":${name}").mod_id}"
type="required"
versionRange="[${project(":${name}").mod_version},)"
ordering="AFTER"
side="BOTH"
"""
    }.join('') + (usesTerraBlender ? """
[[dependencies.${mod_id}]]
modId="terrablender"
type="required"
versionRange="[${terrablender_version.tokenize('-').last()},)"
ordering="AFTER"
side="BOTH"
""" : '')

    // Textures and sounds of the 1.5.2 original are pulled in at build time, see original-assets.txt.
    if (file('original-assets.txt').exists()) {
        def importOriginalAssets = tasks.register('importOriginalAssets', hexxit.ImportOriginalAssets) {
            manifest = rootProject.file('pack/hexxit-1.0.11.json')
            mapping = file('original-assets.txt')
            archive = project.name
            cacheDir = rootProject.file(rootProject.findProperty('hexxit.cache') ?: '.cache').toPath().resolve('zips').toFile()
            outputDir = layout.buildDirectory.dir('generated/original-assets')
        }
        sourceSets.main.resources.srcDir(importOriginalAssets.flatMap { it.outputDir })
    }

    // Assets of a mod taken from its release tag on GitHub (Teil 27: Mantle, Tinkers' Construct 3.12.1), see
    // ImportTagAssets: tag_assets_url/_ref/_dir (clone in .reference/tc3/<dir>), _folders (comma list) and
    // _namespace (the original mod ID, renamed to mod_id on the way)
    if (findProperty('tag_assets_url')) {
        def importTagAssets = tasks.register('importTagAssets', hexxit.ImportTagAssets) {
            url = tag_assets_url
            ref = tag_assets_ref
            folders = tag_assets_folders.tokenize(',')*.trim()
            fromNamespace = tag_assets_namespace
            toNamespace = mod_id
            cloneDir = rootProject.file(".reference/tc3/${tag_assets_dir}")
            outputDir = layout.buildDirectory.dir('generated/tag-assets')
        }
        sourceSets.main.resources.srcDir(importTagAssets.flatMap { it.outputDir })
    }

    // Data converted from a newer original (Teil 27, mods/tconstruct3/tools/convert_data.py writes src/converted/):
    // only the paths listed in data-enabled.txt (prefixes such as data/tconstruct3/tinkering/materials/, one per
    // line, # comments) go into the jar, so data whose loaders and registry entries are not ported yet stays out.
    if (file('src/converted').isDirectory()) {
        def enabled = file('data-enabled.txt').exists()
                ? file('data-enabled.txt').readLines()*.trim().findAll { it && !it.startsWith('#') } : []
        def convertedData = tasks.register('convertedData', Sync) {
            inputs.property('enabled', enabled)
            from('src/converted') {
                include(enabled.isEmpty() ? ['nothing-enabled'] : enabled.collect { it.endsWith('/') ? it + '**' : it })
            }
            into layout.buildDirectory.dir('generated/converted-data')
        }
        sourceSets.main.resources.srcDir(convertedData.map { it.destinationDir })
    }

    // Access transformer of the mod (src/main/resources/META-INF/accesstransformer.cfg, Teil 27c: Mantle). Mods that
    // build on one (mod_requires) compile against its changes too, so their code sees e.g. non-final screen sizes.
    def atFiles = ([project] + required.collect { project(":${it}") })
            .collect { it.file('src/main/resources/META-INF/accesstransformer.cfg') }.findAll { it.exists() }
    if (!atFiles.isEmpty()) {
        neoForge.accessTransformers.from(atFiles)
    }
    def ownAt = file('src/main/resources/META-INF/accesstransformer.cfg').exists()

    // neoforge.mods.toml is generated from one shared template + the mod's gradle.properties.
    def metadata = [
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_version      : mod_version,
            mod_authors      : mod_authors,
            mod_license      : mod_license,
            mod_description  : mod_description,
            minecraft_version: minecraft_version,
            neo_version      : neo_version,
            mod_requires     : requiredToml,
            // "mod_mixins=a.mixins.json,b.mixins.json" in gradle.properties: mixin configs of the mod
            mod_mixins       : (findProperty('mod_mixins') ?: '').tokenize(',')*.trim().collect { "\n[[mixins]]\nconfig=\"${it}\"\n" }.join(''),
            mod_ats          : ownAt ? '\n[[accessTransformers]]\nfile="META-INF/accesstransformer.cfg"\n' : '',
    ]
    tasks.named('processResources') {
        inputs.properties(metadata)
        from(rootProject.file('gradle/neoforge.mods.toml')) {
            into 'META-INF'
            expand(metadata)
        }
    }
}

dependencies {
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

// library mods the pack ships next to the ported ones (TerraBlender)
configurations {
    packLibraries {
        transitive = false
    }
    // client-only library mods: Sodium (renderer) and, once usable, Iris (shaders); the pack stays compatible with them
    packClientLibraries {
        transitive = false
    }
}
dependencies {
    packLibraries "com.github.glitchfiend:TerraBlender-neoforge:${terrablender_version}"
    runtimeOnly "com.github.glitchfiend:TerraBlender-neoforge:${terrablender_version}"
    packClientLibraries "maven.modrinth:sodium:${sodium_version}"
    // Iris only when a version is set (see gradle.properties: no Iris release for 26.3 works with shaders yet)
    if (findProperty('iris_version')) {
        packClientLibraries "maven.modrinth:iris:${iris_version}"
    }
}

// Sodium (+ Iris) only in the client run: it runs on an empty source set whose runtime classpath is the pack's plus
// both jars (26.3 has no per-run extra classpath). -Psodium_iris=false runs the client with the vanilla renderer.
sourceSets {
    clientRun {
        runtimeClasspath = sourceSets.main.runtimeClasspath
        if ((findProperty('sodium_iris') ?: 'true').toBoolean()) {
            runtimeClasspath += configurations.packClientLibraries
        }
    }
}

neoForge {
    mods {
        subprojects.each { mod ->
            "${mod.mod_id}" {
                sourceSet mod.sourceSets.main
            }
        }
    }
    runs {
        client {
            client()
            sourceSet = sourceSets.clientRun
            gameDirectory = file('run/client')
        }
        server {
            server()
            gameDirectory = file('run/server')
            programArgument '--nogui'
        }
    }
}

// All mod jars in one place: build/pack/mods
tasks.register('pack', Copy) {
    group = 'build'
    description = 'Builds every ported mod and collects the jars in build/pack/mods.'
    from(subprojects.collect { it.tasks.named('jar') })
    from(configurations.packLibraries)
    into layout.buildDirectory.dir('pack/mods')
}

// Client-only extras next to it: build/pack/client-mods (Sodium, Iris); copy them into the client's mods folder
tasks.register('packClient', Sync) {
    group = 'build'
    description = 'Collects the client-only library mods (Sodium, Iris) in build/pack/client-mods.'
    from(configurations.packClientLibraries)
    into layout.buildDirectory.dir('pack/client-mods')
}
tasks.named('pack') { finalizedBy 'packClient' }
